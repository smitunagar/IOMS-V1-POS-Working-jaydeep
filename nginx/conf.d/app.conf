# HTTP → HTTPS redirect for ioms360.de
server {
  listen 80;
  server_name ioms360.de www.ioms360.de;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTP for VPS hostname (certbot + proxy)
server {
  listen 80;
  server_name srv1333428.hstgr.cloud;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/mensa-orders/stream {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
  }

  location /scale-bridge/ {
    proxy_pass http://host.docker.internal:8787/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}

server {
  listen 443 ssl;
  server_name srv1333428.hstgr.cloud;

  ssl_certificate /etc/letsencrypt/live/srv1333428.hstgr.cloud/fullchain.pem;
