services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ioms_production}
      POSTGRES_USER: ${DB_USER:-ioms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ioms123}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ioms_production}
      DB_USER: ${DB_USER:-ioms}
      DB_PASSWORD: ${DB_PASSWORD:-ioms123}
      DB_SSL_DISABLED: "true"
    env_file:
      - .env.local
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres

  scale-bridge:
    build: .
    command: ["node", "scripts/scale-bridge.js"]
    environment:
      NODE_ENV: "production"
      SCALE_SERIAL_PORT: "/dev/cu.usbserial-BG02Q7V9"
      SCALE_BAUD: "9600"
      SCALE_HTTP_PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - ./logs:/app/logs
    # Uncomment on Linux if you pass the USB device into the container
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    # privileged: true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  postgres_data:
